name: Deploy docs
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure (root files -> docs/)
        run: |
          mkdir -p docs/stylesheets
          for f in index.md workflow.md setup.md api-reference.md guide.md faq.md changelog.md; do
            if [ -f "$f" ]; then mv "$f" docs/; fi
          done
          if [ -f quillmark.css ]; then mv quillmark.css docs/stylesheets/; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
